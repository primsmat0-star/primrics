<style>
:root{--bg:#3b2518;--panel:#2a1810;--ink:#f2dfbf;--dim:#a88866;--accent:#f2b04a;--line:#5a3d2a;--black:#16100c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{padding:12px 22px 4px}
.brand{margin:0;font-family:Fraunces,Georgia,serif;font-weight:900;font-style:italic;font-size:1.6rem;color:var(--accent);letter-spacing:-.01em}
.now{display:flex;align-items:center;gap:14px;margin-top:8px}
.now h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.15rem}
.now p{margin:2px 0 0;color:var(--dim);font-size:.88rem}
#status{margin:6px 0 0;font-size:.82rem;color:var(--dim);min-height:1.1em}
.vinyl{--lab:#e08a2e;flex:none;width:56px;height:56px;border-radius:50%;position:relative;background:conic-gradient(#16100c,#2d1d12 8%,#16100c 16%,#16100c 50%,#2d1d12 58%,#16100c 66%);box-shadow:inset 0 0 0 4px #251810,inset 0 0 0 5px #0e0a07,inset 0 0 0 9px #1d130c,inset 0 0 0 10px #0e0a07}
.vinyl::before{content:"";position:absolute;inset:32%;border-radius:50%;background:var(--lab)}
.vinyl::after{content:"";position:absolute;inset:47%;border-radius:50%;background:var(--black)}
body.playing #cover{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{font-size:.82rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--black);font-weight:600}
.bar{display:flex;gap:6px;overflow-x:auto;padding:6px 22px 8px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
main{flex:1;min-height:0;position:relative}
#stage,#queueWrap,#plWrap{position:absolute;inset:0}
#stage{background-size:cover;background-position:center}
#stage.hasphoto::before{content:"";position:absolute;inset:0;background:rgba(22,16,12,.55)}
#lyrics{position:absolute;inset:0;overflow-y:auto;margin:0;padding:26vh 22px;list-style:none;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#lyrics li{margin:0 0 .5em}
#lyrics button{all:unset;cursor:pointer;display:block;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.5rem,6.5vw,2.3rem);line-height:1.2;color:var(--dim);transition:color .25s}
#lyrics button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
#lyrics li.on button{color:var(--accent)}
#stage.hasphoto #lyrics button{color:rgba(242,223,191,.72);text-shadow:0 2px 10px rgba(0,0,0,.75)}
#stage.hasphoto #lyrics li.on button{color:var(--accent)}
#stage.full{position:fixed;inset:0;z-index:50;background-color:var(--bg)}
#stage.full #lyrics{padding:32vh 24px}
#stage.full #lyrics button{font-size:clamp(1.9rem,8.5vw,3.2rem)}
#fsbar{display:none}
#stage.full #fsbar{display:flex;position:absolute;z-index:2;left:0;right:0;bottom:0;justify-content:center;align-items:center;gap:16px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(22,16,12,.78)}
.ctl{border:0;background:none;cursor:pointer;font-size:1.4rem;width:48px;height:48px;border-radius:50%}
.ctl.big{width:58px;height:58px;background:var(--accent);color:var(--black)}
#queueWrap,#plWrap{overflow-y:auto;padding:4px 22px 20px}

#queue{list-style:none;margin:0;padding:0}

details{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem}
summary{cursor:pointer;color:var(--dim)}
details label{display:block;margin:10px 0 4px;color:var(--dim)}
details input[type=file],details textarea,details input[type=text]{width:100%}
details textarea,details input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
details textarea{height:80px;font-size:.85rem}
#msg{margin-left:10px;color:var(--dim)}
.find{margin-top:14px}
footer{padding:10px 22px 12px;background:var(--panel);border-top:1px solid var(--line)}
#seek{width:100%;accent-color:var(--accent);margin:0}
.times{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:4px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;font-family:Fraunces,Georgia,serif;font-size:1.1rem}
#plList label{display:block;padding:6px 0}
#plNew{display:flex;gap:8px;margin:12px 0}
#plNew input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.plitem,.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.plitem .vinyl,.trow .vinyl{width:40px;height:40px;box-shadow:inset 0 0 0 3px #251810,inset 0 0 0 4px #0e0a07,inset 0 0 0 7px #1d130c}
.plinfo{all:unset;flex:1;min-width:0;cursor:pointer}
.plinfo:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.plinfo b{display:block;font-family:Fraunces,Georgia,serif;font-weight:700}
.plinfo small{color:var(--dim)}
.chip.sm{padding:6px 12px;font-size:.78rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.plh{font-family:Fraunces,Georgia,serif;font-size:1.4rem;margin:12px 0 0}
#plNew2{display:flex;gap:8px;margin:14px 0}
#plNew2 input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
#plWrap .emp{color:var(--dim)}
#splash{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px))}
#start{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.15rem;padding:14px 44px;border-radius:999px;border:0;background:var(--accent);color:var(--black);cursor:pointer}
.screen{position:absolute;inset:0;overflow-y:auto;padding:4px 22px 20px}
body:not([data-screen="L"]) .now,body:not([data-screen="L"]) .bar,body:not([data-screen="L"]) footer{display:none}
body[data-screen="L"] #mini{display:none}
#nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer;color:var(--dim);font-size:.72rem;padding:4px 0}
#nav button[aria-current="page"]{color:var(--accent)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mini{display:flex;align-items:center;gap:4px;margin:0 10px 6px;padding:8px 8px 10px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
#mini .mi{all:unset;flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer}
#mini .mi:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#mini .mi>div:last-child{min-width:0}
#mini .vinyl{width:40px;height:40px;box-shadow:inset 0 0 0 3px #251810,inset 0 0 0 4px #0e0a07,inset 0 0 0 7px #1d130c}
#mini b,#mini small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini b{font-family:Fraunces,Georgia,serif}
#mini small{color:var(--dim);font-size:.8rem}
#miniPlay{width:42px;height:42px;font-size:1rem}
#miniBar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;background:var(--line)}
#miniFill{display:block;height:2px;width:0;background:var(--accent)}
body.playing #miniCover{animation:spin 5s linear infinite}
.libtabs,.hchips{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto;scrollbar-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:8px;padding:6px 8px 6px 6px;min-height:58px}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .vinyl{width:44px;height:44px;box-shadow:inset 0 0 0 3px #251810,inset 0 0 0 4px #0e0a07,inset 0 0 0 7px #1d130c}
.tile b{font-family:Fraunces,Georgia,serif;font-size:.9rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.on b{color:var(--accent)}
.tile .plus{width:44px;height:44px;flex:none;border-radius:8px;border:1px dashed var(--dim);display:grid;place-items:center;font-size:1.4rem;color:var(--accent)}
.sec{font-family:Fraunces,Georgia,serif;font-size:1.35rem;margin:22px 0 10px}
.hrow{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hrow.wrap{flex-wrap:wrap}
.av{all:unset;display:block;cursor:pointer;flex:none;width:92px;text-align:center}
.av:focus-visible,.card:focus-visible,.rrow:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.disc{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:900;font-size:2rem;color:#16100c;margin-bottom:6px}
.av span{display:block;font-size:.85rem}
.card{all:unset;display:block;cursor:pointer;flex:none;width:140px}
.card .vinyl{width:140px;height:140px;box-shadow:inset 0 0 0 6px #251810,inset 0 0 0 7px #0e0a07,inset 0 0 0 14px #1d130c,inset 0 0 0 15px #0e0a07}
.card b{display:block;margin-top:8px;font-family:Fraunces,Georgia,serif}
.card small{color:var(--dim)}
#q{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:inherit;color:var(--ink);margin:6px 0 4px}
.rrow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;cursor:pointer}
.rrow .vinyl{width:44px;height:44px;box-shadow:inset 0 0 0 3px #251810,inset 0 0 0 4px #0e0a07,inset 0 0 0 7px #1d130c}
.rrow .disc{width:44px;height:44px;font-size:1.1rem;margin:0;flex:none}
.rrow b{display:block;font-family:Fraunces,Georgia,serif}
.rrow small{color:var(--dim)}
body.karaoke #lyrics{text-align:center}
body.karaoke #lyrics li.on .w{color:var(--ink)}
body.karaoke #lyrics li.on .w.sung{color:var(--accent)}
.w.hid{color:transparent!important;text-shadow:none!important;border-bottom:2px solid var(--dim)}
#count{position:absolute;z-index:3;left:0;right:0;top:10%;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:900;font-size:4.5rem;line-height:1;color:var(--accent);pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.now #credit{font-size:.75rem}
#credit a{color:var(--accent)}
#rec{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#recVid{height:min(66vh,680px);aspect-ratio:9/16;max-width:100%;border-radius:14px;background:#000;object-fit:cover;flex:none}
#rec .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
#rec .col2{display:flex;flex-direction:column;gap:12px;align-items:center}
#recMsg{margin:0;min-height:1.2em;font-size:.85rem;color:var(--dim);text-align:center;max-width:420px}
.chip.go{background:var(--accent);border-color:var(--accent);color:var(--black);font-weight:600;padding:10px 20px}
a.chip{text-decoration:none;display:inline-block}
#recTime{font-variant-numeric:tabular-nums;font-size:1.2rem}
#rec .dot{width:12px;height:12px;border-radius:50%;background:#e5484d}
.offcv{position:fixed;left:-9999px;top:0;width:360px;height:640px;pointer-events:none}
.chip.rec{border-color:#e5484d;color:#ff9b9e;display:inline-flex;align-items:center}
.chip.rec[aria-pressed="true"]{background:#e5484d;border-color:#e5484d;color:#fff;font-weight:600}
.rdot{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block;margin-right:7px}
.chip.rec[aria-pressed="true"] .rdot{background:#fff}
.ctl.recfs{color:#e5484d}
.ctl.recfs[aria-pressed="true"]{background:#e5484d;color:#fff}
@media (prefers-reduced-motion: no-preference){.chip.rec[aria-pressed="true"] .rdot,.ctl.recfs[aria-pressed="true"]{animation:blink 1s steps(2,start) infinite}}
@keyframes blink{to{opacity:.35}}
@media (prefers-reduced-motion: reduce){body.playing #miniCover{animation:none}body.playing #cover{animation:none}#lyrics button{transition:none}}
</style>

<audio id="a" preload="auto"></audio>
<script>
const $ = id => document.getElementById(id);
let a = $('a'); const lyr = $('lyrics'), seek = $('seek'), stage = $('stage'), queue = $('queue');
const calm = matchMedia('(prefers-reduced-motion: reduce)');

// Morceaux de démonstration : audio et paroles originaux, générés dans la page
const mk = (title, bpm, hue, chords, pat, lines) => ({ title, artist: 'Primrics Démo', hue, bpm, chords, pat, lines, bars: lines.length*2+1 });
const TRACKS = [
  mk('Lumières de nuit', 96, 285, [[57,60,64],[53,57,60],[48,52,55],[55,59,62]], [0,1,2,1,0,2,1,2], [
    'Les lumières s’allument une à une','Sur la ville qui ne dort jamais','Je marche seul au rythme de la lune',
    'Et ma chanson te cherche en secret','Chante avec moi, la nuit est longue','Chaque mot trouve sa place',
    'Dans le battement de mon cœur','Et si le jour revient trop vite','Garde la mélodie avec toi']),
  mk('Marée basse', 78, 195, [[50,53,57],[46,50,53],[53,57,60],[48,52,55]], [0,2,1,2,0,2,1,2], [
    'Le soir descend sur la jetée','Les vagues se retirent doucement','Je garde un coquillage dans ma main',
    'Il murmure ton prénom','Rien ne presse, rien ne pèse','La mer reviendra demain']),
  mk('Route de sable', 112, 25, [[48,52,55],[55,59,62],[57,60,64],[53,57,60]], [0,1,2,2,1,2,0,1], [
    'La route s’étire devant nous','Le soleil dort sur le capot','Fenêtres ouvertes, radio basse',
    'On chante faux et on s’en fiche','Le sable brille jusqu’à l’horizon','On ne rentre pas ce soir'])
];

function synth(t){
  const SR = 22050, beat = 60/t.bpm, dur = t.bars*4*beat, N = Math.floor(SR*dur), buf = new Float32Array(N);
  const hz = m => 440*Math.pow(2,(m-69)/12);
  const add = (t0, len, f, amp, h) => {
    const s = Math.floor(t0*SR), n = Math.floor(len*SR);
    for(let i=0;i<n && s+i<N;i++){ const x = i/SR; buf[s+i] += Math.exp(-x*5)*Math.min(1,i/80)*amp*(Math.sin(2*Math.PI*f*x)+h*Math.sin(4*Math.PI*f*x)); }
  };
  for(let b=0;b<t.bars;b++){
    const c = t.chords[b%4];
    for(let s=0;s<8;s++){
      const t0 = (b*8+s)*beat/2;
      add(t0, .5, hz(c[t.pat[s]]+12), .16, .35);
      if(s%4===0) add(t0, .9, hz(c[0]-12), .26, 0);
    }
    for(let k=0;k<4;k++){
      const s0 = Math.floor((b*4+k)*beat*SR);
      for(let i=0;i<SR*.18 && s0+i<N;i++){ const x = i/SR; buf[s0+i] += Math.sin(2*Math.PI*(45*x+90*(1-Math.exp(-x*28))/28))*Math.exp(-x*18)*.3; }
    }
  }
  let peak = 0; for(let i=0;i<N;i++) peak = Math.max(peak, Math.abs(buf[i]));
  const fade = SR*1.5, v = new DataView(new ArrayBuffer(44+N*2));
  const w = (o,s) => [...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4,36+N*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,SR,true); v.setUint32(28,SR*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,N*2,true);
  for(let i=0;i<N;i++) v.setInt16(44+i*2, Math.max(-1,Math.min(1,buf[i]/peak*.85*Math.min(1,(N-i)/fade)))*32767, true);
  return URL.createObjectURL(new Blob([v],{type:'audio/wav'}));
}

function parseLRC(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(row=>{
    const tags = [...row.matchAll(/\[(\d+):(\d+(?:[.,]\d+)?)\]/g)], text = row.replace(/\[[^\]]*\]/g,'').trim();
    if(!tags.length || !text) return;
    tags.forEach(m => out.push({t:+m[1]*60+parseFloat(m[2].replace(',','.')), text}));
  });
  return out.sort((x,y)=>x.t-y.t);
}

const linesOf = t => t.custom ? ((t.plain && !(t.lrc||'').trim()) ? t.plain.map(text=>({t:null,text})) : parseLRC(t.lrc || '')) : t.lines.map((text,i)=>({ t:(i*2+.5)*4*60/t.bpm, text }));
const fmt = s => { s = Math.max(0, s||0); return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); };
const keyOf = t => t.key || (t.custom ? 'c:' + t.title + '|' + t.artist : 'd:' + t.title);
TRACKS.push(
  mk('Phare', 88, 330, [[52,55,59],[48,52,55],[57,60,64],[55,59,62]], [0,2,1,2,0,1,2,1], ['Un phare veille sur l’horizon','Il compte les bateaux un à un','Sa lumière te cherche encore','Reviens avant le matin']),
  mk('Coquillage', 70, 170, [[57,60,64],[50,53,57],[53,57,60],[52,56,59]], [0,1,2,1,0,2,1,2], ['Dans le creux de la roche','Un secret dort sous le sable','La mer le reprend la nuit','Mais je connais son chemin']),
  mk('Station-service', 104, 55, [[48,52,55],[53,57,60],[55,59,62],[48,52,55]], [0,2,1,2,0,1,2,1], ['Néons bleus sur le bitume','Un café, deux sourires','Le camion s’éloigne au loin','On se reverra peut-être'])
);
const ART = { 'Lumières de nuit':'Nuit Blanche', 'Phare':'Nuit Blanche', 'Marée basse':'Léa Marée', 'Coquillage':'Léa Marée', 'Route de sable':'Les Routiers', 'Station-service':'Les Routiers' };
TRACKS.forEach(t => { if(ART[t.title]) t.artist = ART[t.title]; });
try{ JSON.parse(localStorage.getItem('primrics.remote') || '[]').forEach(o=>TRACKS.push(o)); }catch(e){}
TRACKS.forEach(t => t.key = keyOf(t));
const vinyl = (el, t) => el.style.setProperty('--lab', 'hsl(' + t.hue + ' 70% 52%)');

let cur = -1, lines = [], active = -1, raf = 0, order = [], view = 'all', favs = new Set(), pls = [], recent = [], karaoke = false, memory = false, kIdx = -2, ac = null, msrc = null, master = null, recDest = null, playingUrl = '';
try{ favs = new Set(JSON.parse(localStorage.getItem('primrics.fav') || '[]')); pls = JSON.parse(localStorage.getItem('primrics.pl') || '[]'); recent = JSON.parse(localStorage.getItem('primrics.rec') || '[]'); }catch(e){}
const save = () => { try{ localStorage.setItem('primrics.fav', JSON.stringify([...favs])); localStorage.setItem('primrics.pl', JSON.stringify(pls)); localStorage.setItem('primrics.rec', JSON.stringify(recent)); }catch(e){} };

function renderLyrics(){
  lyr.innerHTML = '';
  if(!lines.length){
    const li = document.createElement('li'); li.style.cssText = 'color:var(--dim);font-size:1.1rem'; li.textContent = 'Pas de paroles pour ce morceau.';
    if(TRACKS[cur] && TRACKS[cur].custom){ const f = document.createElement('button'); f.className = 'chip find'; f.style.cssText = 'all:revert;font-size:.9rem;padding:9px 18px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer;margin-top:14px;display:inline-block'; f.textContent = 'Chercher les paroles'; f.addEventListener('click', ()=>fetchLyrics(cur)); li.appendChild(document.createElement('br')); li.appendChild(f); }
    lyr.appendChild(li);
  }
  lines.forEach(l=>{
    const li = document.createElement('li'), b = document.createElement('button');
    if(karaoke && l.t !== null) words(b, l.text); else b.textContent = l.text;
    if(l.t === null){ b.style.cssText = 'cursor:default;color:var(--ink);font-size:1.25rem;font-weight:400'; }
    else b.addEventListener('click', ()=>{ a.currentTime = l.t - (TRACKS[cur].offset||0); if(a.paused) a.play(); update(true); });
    li.appendChild(b); lyr.appendChild(li);
  });
  active = -1; kIdx = -2; lyr.scrollTop = 0;
}

function chips(){
  const box = $('chips'); box.innerHTML = '';
  const add = (label, v) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.setAttribute('aria-pressed', view === v); b.addEventListener('click', ()=>{ view = v; renderQueue(); }); box.appendChild(b); };
  add('Tout', 'all'); add('♥ Favoris', 'fav'); pls.forEach((p,i)=>add(p.name, 'p:' + i));
}
function visible(){
  const all = TRACKS.map((_,i)=>i);
  if(view === 'fav') return all.filter(i=>favs.has(TRACKS[i].key));
  if(view.startsWith('p:')){ const p = pls[+view.slice(2)]; return p ? idxOfKeys(p.keys) : all; }
  return all;
}
function renderQueue(){
  const qt = $('qtabs'); qt.innerHTML = ''; qt.appendChild(libTabs('Q'));
  chips(); queue.innerHTML = '';
  const v = visible();
  if(!v.length){ const li = document.createElement('li'); li.className = 'emp'; li.textContent = view === 'fav' ? 'Aucun favori pour l’instant. Touche ♡ pendant l’écoute pour en ajouter.' : 'Cette playlist est vide. Ajoute-y des morceaux avec « + Playlist ».'; queue.appendChild(li); return; }
  v.forEach(i=>{
    const t = TRACKS[i], li = document.createElement('li'), b = document.createElement('button'), c = document.createElement('div'), d = document.createElement('div');
    li.className = i === cur ? 'cur' : '';
    c.className = 'vinyl'; vinyl(c, t);
    d.innerHTML = '<b></b><small></small>'; d.firstChild.textContent = (favs.has(t.key) ? '♥ ' : '') + t.title; d.lastChild.textContent = t.artist || 'Artiste inconnu';
    b.append(c, d); b.addEventListener('click', ()=>{ order = v; load(i, true); });
    li.appendChild(b); queue.appendChild(li);
  });
}
function applyPhoto(){
  const t = TRACKS[cur];
  stage.style.backgroundImage = t.photo ? 'url("' + t.photo + '")' : 'none';
  stage.classList.toggle('hasphoto', !!t.photo);
  $('photoBtn').textContent = t.photo ? 'Retirer la photo' : 'Photo';
}
function syncHeart(){ const on = favs.has(TRACKS[cur].key), b = $('heartBtn'); b.setAttribute('aria-pressed', on); b.textContent = on ? '♥ Favori' : '♡ Favori'; }
function syncPlay(){
  const p = !a.paused; document.body.classList.toggle('playing', p);
  ['play','fsplay','miniPlay'].forEach(id=>{ $(id).textContent = p ? '❚❚' : '▶'; $(id).setAttribute('aria-label', p ? 'Pause' : 'Lecture'); });
}
function load(i, autoplay){
  cur = i; const t = TRACKS[i];
  if(!t.url) t.url = synth(t);
  lines = linesOf(t); $('status').textContent = '';
  if(karaoke && !(lines.length && lines[0].t !== null)){ karaoke = false; applyKaraokeUI(); $('status').textContent = 'Karaoké indisponible : ce morceau n’a pas de paroles synchronisées.'; }
  if(t.remote && msrc) resetAudio();
  playingUrl = (karaoke && t.inst) ? t.inst : t.url; a.src = playingUrl; vocalCut(karaoke && !!t.custom && !t.remote && !t.inst);
  if(karaoke && t.remote && !t.inst) remoteCut(t);
  $('title').textContent = t.title; $('artist').textContent = t.artist || '';
  $('miniTitle').textContent = t.title; $('miniArtist').textContent = t.artist || 'Artiste inconnu'; vinyl($('miniCover'), t);
  document.querySelectorAll('.tile[data-i]').forEach(el=>el.classList.toggle('on', +el.dataset.i === cur));
  vinyl($('cover'), t); applyPhoto(); syncHeart(); renderLyrics(); renderQueue(); update(true);
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist}); }catch(e){} }
  const cr = $('credit'); cr.textContent = '';
  if(t.remote){ cr.append('Jamendo · '); if(t.license){ const l = document.createElement('a'); l.href = t.license; l.target = '_blank'; l.rel = 'noopener'; l.textContent = 'Licence'; cr.appendChild(l); } }
  if(autoplay){ rec(t.key); a.play().catch(()=>{}); }
  if(t.remote && !t.lrc && !t.fetched){ t.fetched = true; fetchLyrics(i); }
}
const ord = () => order.includes(cur) ? order : TRACKS.map((_,i)=>i);
const next = () => { if(recOn) return; const o = ord(); load(o[(o.indexOf(cur)+1) % o.length], true); };
const prev = () => { if(a.currentTime > 3){ a.currentTime = 0; return; } const o = ord(); load(o[(o.indexOf(cur)-1+o.length) % o.length], true); };

function update(force){
  const t = a.currentTime, tl = t + ((TRACKS[cur] && TRACKS[cur].offset) || 0); let idx = -1;
  for(let i=0;i<lines.length;i++){ if(lines[i].t !== null && lines[i].t <= tl) idx = i; else break; }
  if(idx !== active || force){
    active = idx;
    [...lyr.children].forEach((li,i)=> li.classList.toggle('on', i === idx));
    const el = lyr.children[Math.max(idx,0)];
    if(el && !stage.hidden) lyr.scrollTo({top: el.offsetTop - lyr.clientHeight/2 + el.offsetHeight/2, behavior: calm.matches ? 'auto' : 'smooth'});
  }
  if(karaoke) karaokePaint(idx, tl, force);
  if(a.duration) seek.max = a.duration;
  if(!seek.matches(':active')) seek.value = t;
  $('cur').textContent = fmt(t); $('tot').textContent = fmt(a.duration);
  $('miniFill').style.width = (a.duration ? t / a.duration * 100 : 0) + '%';
}
const loop = () => { update(); raf = requestAnimationFrame(loop); };
const toggle = () => a.paused ? a.play() : a.pause();
['play','fsplay','miniPlay'].forEach(id=>$(id).addEventListener('click', toggle));
['next','fsnext'].forEach(id=>$(id).addEventListener('click', next));
['prev','fsprev'].forEach(id=>$(id).addEventListener('click', prev));
function bindAudio(){
  a.addEventListener('play', ()=>{ syncPlay(); cancelAnimationFrame(raf); loop(); });
  a.addEventListener('pause', ()=>{ syncPlay(); cancelAnimationFrame(raf); update(); });
  a.addEventListener('ended', next);
  a.addEventListener('loadedmetadata', ()=> update(true));
  a.addEventListener('error', ()=>{ const t = TRACKS[cur]; if(t && t.remote && a.getAttribute('src')) $('status').textContent = 'Lecture impossible pour ce morceau (réseau ou source indisponible).'; });
}
bindAudio();
seek.addEventListener('input', ()=>{ a.currentTime = +seek.value; update(); });
if('mediaSession' in navigator){ try{
  navigator.mediaSession.setActionHandler('play', ()=>a.play()); navigator.mediaSession.setActionHandler('pause', ()=>a.pause());
  navigator.mediaSession.setActionHandler('nexttrack', next); navigator.mediaSession.setActionHandler('previoustrack', prev);
}catch(e){} }

function show(v){
  document.body.dataset.screen = v;
  const ids = { H:'home', S:'search', P:'plWrap', Q:'queueWrap' };
  stage.hidden = v !== 'L';
  Object.values(ids).forEach(id=>$(id).hidden = ids[v] !== id);
  const nav = { H:'H', S:'S', P:'P', Q:'P', L:'L' }[v];
  ['H','S','P','L'].forEach(k=>$('nav' + k).setAttribute('aria-current', k === nav ? 'page' : 'false'));
  if(v !== 'L') full(false); else update(true);
  if(v === 'H') renderHome(); if(v === 'S') renderResults(); if(v === 'P') renderPlaylists();
}

function full(on){
  if(on && stage.hidden) show('L');
  stage.classList.toggle('full', on); $('fsBtn').setAttribute('aria-pressed', on);
  try{ if(on) { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(r && r.catch) r.catch(()=>{}); } else if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  update(true);
}
$('fsBtn').addEventListener('click', ()=>full(!stage.classList.contains('full')));
$('fsclose').addEventListener('click', ()=>full(false));
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement) full(false); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && stage.classList.contains('full')) full(false); });

$('heartBtn').addEventListener('click', ()=>{ const k = TRACKS[cur].key; favs.has(k) ? favs.delete(k) : favs.add(k); save(); syncHeart(); renderQueue(); });

function openPl(){
  const t = TRACKS[cur], box = $('plList'); box.innerHTML = '';
  if(!pls.length){ const p = document.createElement('p'); p.style.color = 'var(--dim)'; p.textContent = 'Aucune playlist. Crée la première ci-dessous.'; box.appendChild(p); }
  pls.forEach(p=>{
    const l = document.createElement('label'), c = document.createElement('input'); c.type = 'checkbox'; c.checked = p.keys.includes(t.key);
    c.addEventListener('change', ()=>{ p.keys = c.checked ? [...new Set([...p.keys, t.key])] : p.keys.filter(k=>k !== t.key); save(); renderQueue(); });
    l.append(c, ' ' + p.name); box.appendChild(l);
  });
  if(!$('dlg').open) $('dlg').showModal();
}
$('plBtn').addEventListener('click', openPl);
$('plClose').addEventListener('click', ()=>$('dlg').close());
$('plNew').addEventListener('submit', e=>{
  e.preventDefault(); const n = $('plName').value.trim(); if(!n) return;
  pls.push({ name: n, keys: [TRACKS[cur].key] }); $('plName').value = ''; save(); renderQueue(); openPl();
});

$('photoBtn').addEventListener('click', ()=>{
  const t = TRACKS[cur];
  if(t.photo){ URL.revokeObjectURL(t.photo); t.photo = null; applyPhoto(); } else $('photoIn').click();
});
$('photoIn').addEventListener('change', ()=>{
  const f = $('photoIn').files[0]; if(!f) return;
  const t = TRACKS[cur]; if(t.photo) URL.revokeObjectURL(t.photo);
  t.photo = URL.createObjectURL(f); $('photoIn').value = '';
  show('L'); applyPhoto(); $('status').textContent = 'Photo ajoutée. Elle reste sur cet appareil.';
});

$('file').addEventListener('change', ()=>{
  const f = $('file').files[0]; if(!f) return;
  const base = f.name.replace(/\.[^.]+$/,''), m = base.split(/\s+-\s+/);
  if(m.length >= 2){ $('art').value = m[0].trim(); $('ttl').value = m.slice(1).join(' - ').trim(); } else { $('ttl').value = base; }
});
const durationOf = url => new Promise(res => { const au = new Audio(); au.preload = 'metadata'; au.onloadedmetadata = () => res(au.duration); au.onerror = () => res(0); au.src = url; });

async function fetchLyrics(i){
  const t = TRACKS[i], st = $('status');
  st.textContent = 'Recherche des paroles…';
  try{
    const r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent((t.artist + ' ' + t.title).trim()));
    if(!r.ok) throw new Error(r.status);
    const res = (await r.json()).filter(x => x.syncedLyrics || x.plainLyrics);
    const sy = res.filter(x => x.syncedLyrics), pool = sy.length ? sy : res;
    if(!pool.length){ st.textContent = 'Aucune parole trouvée. Corrige l’artiste ou le titre, ou colle un fichier LRC.'; return; }
    const d = t.duration || await durationOf(t.url);
    if(d) pool.sort((x,y) => Math.abs(x.duration-d) - Math.abs(y.duration-d));
    const hit = pool[0];
    if(hit.syncedLyrics){ t.lrc = hit.syncedLyrics; t.plain = null; }
    else { t.lrc = ''; t.plain = hit.plainLyrics.split(/\r?\n/).filter(Boolean); }
    st.textContent = hit.syncedLyrics ? 'Paroles synchronisées trouvées.' : 'Paroles non synchronisées : pas de surlignage.';
    if(cur === i){ lines = linesOf(t); renderLyrics(); update(true); }
  }catch(e){ st.textContent = 'Impossible de joindre LRCLIB (connexion ou CORS).'; }
}


$('add').addEventListener('click', ()=>{

  const maxW = W * 0.8, cy = H * 0.5, lh = 78, lh2 = 52;
  rctx.font = '800 64px ' + FONT;
  const cl = idx >= 0 ? wrapText(lines[idx].text, maxW) : [], ch = cl.length * lh, top = cy - ch / 2;
  if(idx >= 0){
    const l = lines[idx], nx = lines[idx + 1], end = Math.min(nx ? nx.t : l.t + 6, l.t + 6) - 0.3;
    const p = Math.max(0, Math.min(1, (tl - l.t) / Math.max(.5, end - l.t)));
    const total = cl.reduce((n, x)=>n + x.length, 0), done = p * total; let start = 0;
    cl.forEach((ln, k)=>{
      const y = top + k * lh + lh / 2, w = rctx.measureText(ln).width, fr = Math.max(0, Math.min(1, (done - start) / ln.length)); start += ln.length;
      rctx.fillStyle = '#f2dfbf'; rctx.fillText(ln, W / 2, y);
      if(fr > 0){ rctx.save(); rctx.beginPath(); rctx.rect(W / 2 - w / 2, y - lh / 2, w * fr, lh); rctx.clip(); rctx.fillStyle = '#f2b04a'; rctx.fillText(ln, W / 2, y); rctx.restore(); }
    });
  }
  rctx.font = '600 40px ' + FONT; rctx.fillStyle = 'rgba(242,223,191,.62)';
  const pv = idx > 0 ? wrapText(lines[idx - 1].text, maxW) : [], nv = lines[idx + 1] ? wrapText(lines[idx + 1].text, maxW) : [];
  pv.forEach((ln, k)=>rctx.fillText(ln, W / 2, top - 36 - (pv.length - k) * lh2 + lh2 / 2));
  nv.forEach((ln, k)=>rctx.fillText(ln, W / 2, top + ch + 36 + k * lh2 + lh2 / 2));
  rctx.restore();
}
function recLoop(){
  drawFrame();
  if(recOn){
    const el = (performance.now() - recStart) / 1000;

    if(el >= 180 || a.ended) stopRec(false);
  }
  recRAF = requestAnimationFrame(recLoop);
}
function recUI(on){ ['recBtn','fsRec'].forEach(id=>$(id).setAttribute('aria-pressed', on)); if(!on) $('recLbl').textContent = 'Enregistrer'; }
async function toggleRec(){
  if(recOn){ stopRec(false); return; }
  if(recBusy) return;

  if(!(lines.length && lines[0].t !== null)){ $('status').textContent = 'L’enregistrement demande des paroles synchronisées.'; return; }
  if(!window.MediaRecorder || !rcv.captureStream){ $('status').textContent = 'Ce navigateur ne permet pas d’enregistrer une vidéo. Essaie Safari ou Chrome à jour.'; return; }
  recBusy = true; $('status').textContent = 'Préparation de l’enregistrement…';
  if(!t.remote && a.paused) a.play().catch(()=>{});
  recImg = null; if(t.photo){ recImg = new Image(); recImg.src = t.photo; }
  cancelAnimationFrame(recRAF); recLoop();
  const audioOK = await prepareAudio(t);
  const stream = rcv.captureStream(30);
  if(audioOK && recDest) recDest.stream.getAudioTracks().forEach(x=>stream.addTrack(x));
  recMime = pickMime();
  try{ mr = new MediaRecorder(stream, recMime ? { mimeType: recMime, videoBitsPerSecond: 4000000 } : { videoBitsPerSecond: 4000000 }); }
  catch(e){ $('status').textContent = 'Enregistrement impossible sur ce navigateur.'; cancelAnimationFrame(recRAF); recBusy = false; return; }
  chunks = []; mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); }; mr.onstop = finishRec;
  if(a.ended || (a.duration && a.currentTime >= a.duration - 1)) a.currentTime = 0;
  try{ await a.play(); }catch(e){ $('status').textContent = 'Touche le bouton rouge une seconde fois pour lancer la musique.'; cancelAnimationFrame(recRAF); recBusy = false; return; }
  mr.start(250); recOn = true; recDiscard = false; recStart = performance.now(); recUI(true); recBusy = false;
  $('status').textContent = audioOK ? 'Enregistrement en cours. Touche le bouton rouge pour arrêter.' : 'Enregistrement sans le son (ce morceau en ligne ne le permet pas). Ajoute la musique dans TikTok.';
}
function stopRec(discard){ if(!recOn) return; recOn = false; recDiscard = !!discard; cancelAnimationFrame(recRAF); a.pause(); try{ mr.stop(); }catch(e){} }
function finishRec(){
  recUI(false);
  if(recDiscard) return;
  recBlob = new Blob(chunks, { type: (mr && mr.mimeType) || recMime || 'video/webm' });
  if(recUrl) URL.revokeObjectURL(recUrl); recUrl = URL.createObjectURL(recBlob);
  const ext = recBlob.type.indexOf('mp4') >= 0 ? 'mp4' : 'webm', t = TRACKS[cur];
  $('recVid').src = recUrl;
  const sv = $('recSave'); sv.href = recUrl; sv.download = 'primrics-' + String(t.title || 'clip').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.' + ext;
  let canShare = false; try{ canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([recBlob], 'x.' + ext, { type: recBlob.type })] })); }catch(e){}
  $('recShare').hidden = !canShare;
  $('recMsg').textContent = ext === 'webm' ? 'Format WebM : si TikTok le refuse, convertis-le en MP4 (avec CapCut, par exemple).' : (canShare ? 'Sur iPhone : touche Partager, puis « Enregistrer la vidéo ».' : '');
  $('status').textContent = ''; $('rec').hidden = false;
}
function closeRec(){ $('rec').hidden = true; $('recVid').pause(); $('recVid').removeAttribute('src'); }
$('recBtn').addEventListener('click', toggleRec);
$('fsRec').addEventListener('click', toggleRec);
$('recClose').addEventListener('click', closeRec);
$('recShare').addEventListener('click', async ()=>{ try{ await navigator.share({ files: [new File([recBlob], $('recSave').download, { type: recBlob.type })], title: 'Primrics' }); }catch(e){} });

$('start').addEventListener('click', ()=>{ $('splash').hidden = true; });
$('start').focus();

order = TRACKS.map((_,i)=>i);
load(0, false);
show('H');
loadJamendo();
